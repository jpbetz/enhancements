metrics:
  # Registration / manifest loading health (KEP-5793 naming convention)
  - apiserver_static_crd_controller_automatic_reloads_total
  - apiserver_static_crd_controller_automatic_reload_last_timestamp_seconds
  - apiserver_static_crd_controller_last_config_info
  - apiserver_static_crd_controller_last_storage_config_info
  - apiserver_static_crd_controller_reconcile_total
  - apiserver_static_crd_controller_last_reconcile_success_timestamp_seconds
  - apiserver_static_crd_registered
  - apiserver_static_crd_unsynced
  # Revision convergence (manifest lifecycle arbitration)
  - apiserver_static_crd_controller_manifest_revision
  - apiserver_static_crd_controller_config_behind
  - apiserver_static_crd_controller_frozen
  - apiserver_static_crd_denied_writes_total
  # Storage binding safety and observability
  - apiserver_custom_resource_storage_binding
  - apiserver_custom_resource_storage_precheck_total
  - apiserver_custom_resource_storage_binding_rejected_total
  - apiserver_static_crd_storage_warmup_duration_seconds
